# Grid Search Configuration for Scheduler Comparison
# 18 total experiments: 9 Cosine Annealing + 9 One Cycle

# Base training parameters (inherited from main config.yaml)
base_config: configs/config.yaml

# Grid search specific settings
grid_search:
  epochs: 25
  early_stopping_patience: 7
  seed: 42
  
# Cosine Annealing Scheduler Grid (9 combinations)
# Tests different learning rate and minimum learning rate combinations
cosine_annealing:
  learning_rates: [0.001, 0.0005, 0.0003]
  min_lrs: [1.0e-06, 1.0e-05, 1.0e-04]

# One Cycle Scheduler Grid (9 combinations)  
# Tests different max learning rate and warmup percentage combinations
one_cycle:
  max_lrs: [0.001, 0.002, 0.003]
  pct_starts: [0.2, 0.3, 0.4]

# Output configuration
output:
  results_dir: experiments/grid_search/results
  summary_csv: experiments/grid_search/results/summary.csv

# Phase 12: GATv2 + Radius Graph Feature + Contact Count
# Edge: in_radius (1 se distance < 8.0A) -> edge_dim: 12
# Node: contact_count_10A -> in_channels: 93
# Target: R2 >= 0.60 (recuperare GINE performance)

data:
  root: dataset
  batch_size: 32
  num_workers: 4
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

features:
  use_aggregated: false
  use_reduced: false
  include_atom_type: true
  include_geometric: true
  include_backbone_angles: true  # 93 node features (88+4+1)

model:
  model_type: gnn
  in_channels: 93               # 88 + 4 backbone + 1 contact_count_10A
  hidden_channels: 128          # 4 heads x 32 = 128
  num_layers: 3
  dropout: 0.20                 # Lower for attention
  conv_type: gatv2              # GATv2 with dynamic attention
  edge_dim: 12                  # 11 + 1 radius graph feature

training:
  num_epochs: 200
  learning_rate: 5.0e-04
  weight_decay: 5.0e-05         # Lighter with attention
  scheduler: one_cycle
  early_stopping_patience: 35   # Extra patience for attention
  gradient_clip: 1.0            # Critical for stability
  use_amp: true
  cudnn_benchmark: true
  deterministic: false
  # OneCycle params - conservative for attention
  max_lr: 0.002                 # Reduced from 0.003
  warmup_epochs: 25             # Longer warmup for attention
  div_factor: 25.0
  final_div_factor: 10000.0
  # Weighted Loss (same as GINE best)
  weighted_loss: true
  loss_alpha: 1.5
  loss_threshold: 0.8
  loss_power: 1.0

experiment:
  name: phase12_gatv2_radius_graph
  checkpoint_dir: experiments/checkpoints
  log_dir: experiments/logs
  save_best: true
  seed: 42

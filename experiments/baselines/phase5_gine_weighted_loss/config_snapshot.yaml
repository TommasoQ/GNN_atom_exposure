data:
  root: dataset
  batch_size: 32
  num_workers: 4
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

model:
  model_type: gnn
  in_channels: 88
  hidden_channels: 96
  num_layers: 3
  dropout: 0.35
  conv_type: gine

training:
  num_epochs: 150
  learning_rate: 0.0005
  weight_decay: 1.0e-04
  scheduler: one_cycle
  patience: 10
  early_stopping_patience: 20
  min_lr: 1.0e-06
  gradient_clip: 1.0
  use_amp: true
  cudnn_benchmark: true
  deterministic: true
  max_lr: 0.003
  warmup_epochs: 15
  div_factor: 25.0
  final_div_factor: 10000.0
  weighted_loss: true
  loss_alpha: 1.5
  loss_threshold: 0.8
  loss_symmetric: false

experiment:
  name: phase5_weighted_loss
  checkpoint_dir: experiments/checkpoints
  log_dir: experiments/logs
  save_best: true
  seed: 42

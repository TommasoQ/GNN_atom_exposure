# Phase 13a: Lower LR + Regularization Tuning
# Based on Phase 12 (R²=0.8817) with stability improvements
# Changes:
#   - max_lr: 0.002 -> 0.001 (reduce oscillation)
#   - warmup_epochs: 25 -> 35 (smoother warmup)
#   - patience: 35 -> 50 (more patience for convergence)
#   - dropout: 0.20 -> 0.25 (reduce overfitting)
#   - weight_decay: 5e-5 -> 1e-4 (stronger regularization)

data:
  root: dataset
  batch_size: 32
  num_workers: 4
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

features:
  use_aggregated: false
  use_reduced: false
  include_atom_type: true
  include_geometric: true
  include_backbone_angles: true  # 93 node features (88+4+1 contact_count)

model:
  model_type: gnn
  in_channels: 93               # 88 + 4 backbone + 1 contact_count_10A
  hidden_channels: 128          # 4 heads x 32 = 128
  num_layers: 3
  dropout: 0.25                 # INCREASED from 0.20
  conv_type: gatv2              # GATv2 with dynamic attention
  edge_dim: 12                  # 11 + 1 radius graph feature

training:
  num_epochs: 200
  learning_rate: 5.0e-04
  weight_decay: 1.0e-04         # INCREASED from 5e-05
  scheduler: one_cycle
  early_stopping_patience: 50   # INCREASED from 35
  gradient_clip: 1.0
  use_amp: true
  cudnn_benchmark: true
  deterministic: false
  # OneCycle params - MORE CONSERVATIVE
  max_lr: 0.001                 # REDUCED from 0.002
  warmup_epochs: 35             # INCREASED from 25
  div_factor: 25.0
  final_div_factor: 10000.0
  # Weighted Loss (same as Phase 12)
  weighted_loss: true
  loss_alpha: 1.5
  loss_threshold: 0.8
  loss_power: 1.0
  # NEW: Early stopping on R² instead of val_loss
  early_stopping_metric: r2     # NEW: use R² for early stopping

experiment:
  name: phase13a_lower_lr
  checkpoint_dir: experiments/checkpoints
  log_dir: experiments/logs
  save_best: true
  seed: 42

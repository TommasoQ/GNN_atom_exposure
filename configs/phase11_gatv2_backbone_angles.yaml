# Phase 11: GATv2 with Backbone Angles
# Transition from GINE (R²=0.6028) to GATv2 attention mechanism
# Key changes: Lower LR, longer warmup, ELU activation, internal residual
# Target: R² ≥ 0.60 (match or beat GINE)

data:
  root: dataset
  batch_size: 32
  num_workers: 4
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

features:
  use_aggregated: false
  use_reduced: false
  include_atom_type: true
  include_geometric: true
  include_backbone_angles: true  # 92 features (88 + 4 backbone)

model:
  model_type: gnn
  in_channels: 92               # 88 + 4 backbone angles
  hidden_channels: 128          # 4 heads × 32 = 128
  num_layers: 3                 # Conservative - avoid over-smoothing
  dropout: 0.20                 # Lower than GINE - attention provides regularization
  conv_type: gatv2              # GATv2 with dynamic attention
  edge_dim: 11                  # 7 bond types + 4 numerical edge features

training:
  num_epochs: 200
  learning_rate: 5.0e-04        # Base LR for OneCycle
  weight_decay: 5.0e-05         # Lighter than GINE (attention regularizes)
  scheduler: one_cycle
  early_stopping_patience: 35   # Extra patience for attention learning
  gradient_clip: 1.0            # Critical for attention stability
  use_amp: true
  cudnn_benchmark: true
  deterministic: false
  # OneCycle parameters - CONSERVATIVE for attention
  max_lr: 0.002                 # REDUCED from 0.003 - attention is LR sensitive
  warmup_epochs: 25             # LONGER warmup for attention stabilization
  div_factor: 25.0
  final_div_factor: 10000.0
  # Weighted Loss (same as GINE best)
  weighted_loss: true
  loss_alpha: 1.5
  loss_threshold: 0.8
  loss_power: 1.0               # Linear weighting for stability

experiment:
  name: phase11_gatv2_backbone_angles
  checkpoint_dir: experiments/checkpoints
  log_dir: experiments/logs
  save_best: true
  seed: 42

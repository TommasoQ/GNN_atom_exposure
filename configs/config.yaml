data:
  root: dataset  # Dataset directory with processed/ and raw/ subdirectories
  batch_size: 32  # Increased for faster training (was 8)
  num_workers: 4
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

model:
  model_type: gnn  # 'gnn' or 'simple'
  in_channels: 88  # REDUCED: 24 numerical + 57 categorical (31+5+21) + 7 geometric
  hidden_channels: 96  # Back to 96 (simpler model)
  num_layers: 3  # Back to 3 layers (4L gave only +0.5%)
  dropout: 0.35  # Exp 4.2: Slightly higher dropout
  conv_type: gine  # Exp 4.5: GINE with edge features (re-evaluating with improved dropout)

training:
  num_epochs: 150  # Extended training - let early stopping decide
  learning_rate: 0.0005  # Base LR (used as div_factor base for OneCycle)
  weight_decay: 1.0e-04  # Moderate regularization
  scheduler: one_cycle  # WINNER from grid search (R²=0.5456)
  patience: 10  # For learning rate reduction (if using reduce_on_plateau)
  early_stopping_patience: 20  # Room to find true plateau
  min_lr: 1.0e-06
  gradient_clip: 1.0  # Prevent gradient explosion
  # Performance optimizations
  use_amp: true  # Automatic Mixed Precision for ~30-50% speedup
  cudnn_benchmark: true  # Enable cuDNN auto-tuner for faster convolutions
  # One Cycle Scheduler Parameters (OPTIMAL from grid search)
  max_lr: 0.003  # Best from grid search
  warmup_epochs: 15  # Fixed warmup length (pct_start calculated from this)
  div_factor: 25.0
  final_div_factor: 10000.0

experiment:
  name: phase5_optimal_50ep
  checkpoint_dir: experiments/checkpoints
  log_dir: experiments/logs
  save_best: true
  seed: 42

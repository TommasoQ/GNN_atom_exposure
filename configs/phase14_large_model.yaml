# Phase 14: Large Model with ~500K Parameters
# Based on Phase 13a (R²=0.8817) with dramatically increased capacity
# Changes:
#   - hidden_channels: 128 -> 176 (1.38x wider, divisible by 4 for GATv2 heads)
#   - num_layers: 3 -> 5 (5 GATv2 layers for deep hierarchical learning)
#   - Total params: ~71K -> ~505K (7.0x increase, ~500K target)
#   - dropout: 0.25 -> 0.28 (stronger regularization for larger model)
#   - batch_size: 32 -> 28 (reduce memory footprint)
#   - max_lr: 0.001 -> 0.0009 (slightly more conservative for stability)
#   - weight_decay: 1e-4 -> 1.5e-4 (stronger weight regularization)
#   - warmup_epochs: 35 -> 40 (longer warmup for larger model)
#   - patience: 50 -> 60 (more patience for convergence)

data:
  root: dataset
  batch_size: 28                # REDUCED from 32 (memory optimization)
  num_workers: 4
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

features:
  use_aggregated: false
  use_reduced: false
  include_atom_type: true
  include_geometric: true
  include_backbone_angles: true  # 92 node features (24+31+5+21+7+4)

model:
  model_type: gnn
  in_channels: 92               # 88 + 4 backbone angles (contact_count removed)
  hidden_channels: 176          # INCREASED from 128 (1.38x wider, divisible by 4 for heads)
  num_layers: 5                 # INCREASED from 3 (deeper hierarchy)
  dropout: 0.28                 # INCREASED from 0.25 (prevent overfitting)
  conv_type: gatv2              # GATv2 with dynamic attention
  edge_dim: 12                  # 11 + 1 radius graph feature

training:
  num_epochs: 200
  learning_rate: 5.0e-04
  weight_decay: 1.5e-04         # INCREASED from 1.0e-04 (stronger regularization)
  scheduler: one_cycle
  early_stopping_patience: 60   # INCREASED from 50 (more patience)
  gradient_clip: 1.0
  use_amp: true
  cudnn_benchmark: true
  deterministic: false
  # OneCycle params - CONSERVATIVE for large model
  max_lr: 0.0009                # REDUCED from 0.001 (stability for 500K params)
  warmup_epochs: 40             # INCREASED from 35 (smoother warmup)
  div_factor: 25.0
  final_div_factor: 10000.0
  # Weighted Loss (same as Phase 13a)
  weighted_loss: true
  loss_alpha: 1.5
  loss_threshold: 0.8
  loss_power: 1.0
  # Early stopping on R² instead of val_loss
  early_stopping_metric: r2

experiment:
  name: phase14_large_model
  checkpoint_dir: experiments/checkpoints
  log_dir: experiments/logs
  save_best: true
  seed: 42

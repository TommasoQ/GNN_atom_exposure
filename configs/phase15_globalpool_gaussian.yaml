# Phase 15 + Global Pooling + Gaussian Noise
#
# Same as phase15_globalpool (current best: R² = 0.9408) with
# Gaussian noise injection on input features during training.
#
# The noise acts as a regularizer, preventing overfitting on the
# static crystallographic coordinates from PDB structures.
#
# Change vs phase15_globalpool:
#   - input_noise_std: 0.02 (σ = 2% on normalized features, training only)

data:
  root: dataset
  batch_size: 32
  num_workers: 4
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

features:
  use_aggregated: false
  use_reduced: false
  include_atom_type: true
  include_geometric: true       # 8 geometric features (WITH contact_count!)
  include_backbone_angles: true  # 93 node features: 24+31+5+21+8+4

model:
  model_type: gnn
  in_channels: 93               # 93 features (WITH contact_count)
  hidden_channels: 136
  num_layers: 4
  dropout: 0.26
  conv_type: gatv2
  edge_dim: 12
  # Dynamic Global Pooling
  use_global_pool: true
  global_pool_type: mean
  global_pool_layers: every
  # Gaussian noise on input features (training only)
  input_noise_std: 0.02

training:
  num_epochs: 200
  learning_rate: 5.0e-04
  weight_decay: 1.2e-04
  scheduler: one_cycle
  early_stopping_patience: 60
  early_stopping_metric: r2
  gradient_clip: 0.5
  use_amp: true
  cudnn_benchmark: true
  deterministic: false

  # OneCycle scheduler
  max_lr: 0.0007
  warmup_epochs: 50
  div_factor: 25.0
  final_div_factor: 10000.0

  # Range-Specific Weighted Loss
  weighted_loss: true
  loss_type: range_specific
  loss_range_weights:
    buried: 1.5
    semi_buried: 1.0
    intermediate: 1.0
    semi_exposed: 1.3
    exposed: 2.0

  loss_asymmetric_penalty: 1.5

  # Fallback params
  loss_alpha: 1.5
  loss_threshold: 0.8
  loss_power: 1.0

experiment:
  name: phase15_globalpool_gaussian
  checkpoint_dir: experiments/checkpoints
  log_dir: experiments/logs
  save_best: true
  seed: 42

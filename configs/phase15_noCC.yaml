# Phase 15 noCC: Best Model WITHOUT contact_count (~254K Parameters)
# Re-training of Phase 15 with contact_count_10A feature removed
#
# Original Phase 15 Results (with contact_count):
#   - R² = 0.8892 (BEST performance so far)
#   - Training: Very stable, no spikes
#   - Bias: Buried +0.0394, Exposed -0.0603 (30% and 25% improvement vs Phase 14)
#   - ROI: Excellent (+0.9% R² with 3.5x params vs baseline)
#
# This version (Phase 15 noCC):
#   - SAME architecture and hyperparameters as Phase 15
#   - ONLY DIFFERENCE: 92 features instead of 93 (contact_count removed)
#   - Expected: Equal or slightly better performance
#   - Purpose: Verify if contact_count was redundant or harmful
#
# Feature Change:
#   - Geometric features: 8 -> 7 (removed contact_count_10A)
#   - Total features: 93 -> 92
#   - Parameters: 253,913 -> 253,777 (-136 params)
#
# If this performs:
#   - Equal to Phase 15: contact_count was redundant (good removal)
#   - Better than Phase 15: contact_count was harmful (excellent removal)
#   - Worse than Phase 15 (>0.005 R² drop): contact_count was important (consider reverting)

data:
  root: dataset
  batch_size: 32                # Proven optimal for this model size
  num_workers: 4
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

features:
  use_aggregated: false
  use_reduced: false
  include_atom_type: true
  include_geometric: true       # 7 geometric features (contact_count removed)
  include_backbone_angles: true  # 92 node features: 24+31+5+21+7+4

model:
  model_type: gnn
  in_channels: 92               # Reduced from 93 (contact_count removed)
  hidden_channels: 136          # Sweet spot for 254K params
  num_layers: 4                 # Proven stable depth
  dropout: 0.26                 # Optimal for this model size
  conv_type: gatv2              # GATv2 with dynamic attention
  edge_dim: 12                  # 11 bond/distance features + 1 radius indicator

training:
  num_epochs: 200
  learning_rate: 5.0e-04
  weight_decay: 1.2e-04         # Optimal regularization
  scheduler: one_cycle
  early_stopping_patience: 60
  gradient_clip: 0.5            # Tight clipping for stability
  use_amp: true
  cudnn_benchmark: true
  deterministic: false

  # OneCycle scheduler - PROVEN STABLE parameters
  max_lr: 0.0007                # Conservative max_lr (no spikes)
  warmup_epochs: 50             # Long warmup for smooth start
  div_factor: 25.0
  final_div_factor: 10000.0

  # Range-Specific Weighted Loss - PROVEN EFFECTIVE
  weighted_loss: true
  loss_type: range_specific
  loss_range_weights:
    buried: 1.5                 # Penalize buried overestimation
    semi_buried: 1.0            # Baseline
    intermediate: 1.0           # Baseline
    semi_exposed: 1.3           # Moderate penalty
    exposed: 2.0                # Strong penalty for exposed underestimation

  # Asymmetric penalty (applied in RangeSpecificWeightedMSELoss)
  loss_asymmetric_penalty: 1.5  # Additional directional penalty

  # Fallback params (not used with range_specific)
  loss_alpha: 1.5
  loss_threshold: 0.8
  loss_power: 1.0

experiment:
  name: phase15_noCC
  checkpoint_dir: experiments/checkpoints
  log_dir: experiments/logs
  save_best: true
  seed: 42

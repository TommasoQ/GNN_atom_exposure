# Phase 16: Enhanced Loss + Moderate Model Scaling (~300K Parameters)
# Based on Phase 15 results - addressing remaining bias with stronger penalties
# Strategy:
#   - Moderate model size increase to ~300K params (vs 254K in Phase 15)
#   - Enhanced range-specific loss weights (stronger penalties)
#   - Maintain conservative training approach from Phase 15
# Changes from Phase 15:
#   - hidden_channels: 136 -> 152 (12% increase for more capacity)
#   - Total params: 254K -> ~300K (18% increase, balanced scaling)
#   - buried_weight: 1.5 -> 2.0 (33% increase, fight overestimation)
#   - exposed_weight: 2.0 -> 2.5 (25% increase, fight underestimation)
#   - asymmetric_penalty: 1.5 -> 2.0 (33% increase, stronger directional penalty)
#   - dropout: 0.26 -> 0.27 (slight increase for slightly larger model)
#   - All other training params kept conservative for stability

data:
  root: dataset
  batch_size: 32
  num_workers: 4
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

features:
  use_aggregated: false
  use_reduced: false
  include_atom_type: true
  include_geometric: true
  include_backbone_angles: true  # 93 node features

model:
  model_type: gnn
  in_channels: 93               # 88 + 4 backbone + 1 contact_count_10A
  hidden_channels: 152          # INCREASED from 136 (balanced capacity boost, divisible by 4)
  num_layers: 4                 # KEPT at 4 (proven stable depth)
  dropout: 0.27                 # SLIGHTLY INCREASED from 0.26 (for larger model)
  conv_type: gatv2              # GATv2 with dynamic attention
  edge_dim: 12                  # 11 + 1 radius graph feature

training:
  num_epochs: 200
  learning_rate: 5.0e-04
  weight_decay: 1.2e-04         # KEPT same (still appropriate)
  scheduler: one_cycle
  early_stopping_patience: 60
  gradient_clip: 0.5            # KEPT at 0.5 (proven stable)
  use_amp: true
  cudnn_benchmark: true
  deterministic: false
  # OneCycle params - KEPT CONSERVATIVE for stability
  max_lr: 0.0007                # KEPT at 0.0007 (stable training)
  warmup_epochs: 50             # KEPT at 50 (smooth warmup)
  div_factor: 25.0
  final_div_factor: 10000.0
  # ENHANCED: Range-Specific Weighted Loss with stronger penalties
  weighted_loss: true
  loss_type: range_specific
  # ENHANCED range-specific weights (stronger penalties for bias correction)
  loss_range_weights:
    buried: 2.0                 # INCREASED from 1.5 (fight +0.0394 bias harder)
    semi_buried: 1.0            # KEPT baseline
    intermediate: 1.0           # KEPT baseline
    semi_exposed: 1.3           # KEPT at 1.3
    exposed: 2.5                # INCREASED from 2.0 (fight -0.0603 bias harder)
  # Asymmetric penalty (applied in RangeSpecificWeightedMSELoss)
  loss_asymmetric_penalty: 2.0  # INCREASED from 1.5 (stronger directional penalty)
  # Fallback params (not used with range_specific)
  loss_alpha: 1.5
  loss_threshold: 0.8
  loss_power: 1.0

experiment:
  name: phase16_enhanced
  checkpoint_dir: experiments/checkpoints
  log_dir: experiments/logs
  save_best: true
  seed: 42

data:
  batch_size: 8
  num_workers: 4
  root: dataset
  test_split: 0.1
  train_split: 0.8
  val_split: 0.1
experiment:
  checkpoint_dir: experiments/checkpoints
  log_dir: experiments/logs
  name: grid_onecycle_max0.002_pct0.2
  save_best: true
  seed: 42
model:
  conv_type: gine
  dropout: 0.35
  hidden_channels: 96
  in_channels: 88
  model_type: gnn
  num_layers: 3
training:
  div_factor: 25.0
  early_stopping_patience: 15
  final_div_factor: 10000.0
  gradient_clip: 1.0
  learning_rate: 0.0005
  max_lr: 0.002
  min_lr: 1.0e-06
  num_epochs: 15
  patience: 10
  pct_start: 0.2
  scheduler: one_cycle
  weight_decay: 0.0001
